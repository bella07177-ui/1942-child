<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>하늘 비행기 놀이</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:flex;justify-content:center;background:linear-gradient(180deg,#dff5ff 0%,#f6fbff 100%);font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:#25324a}
    .game-wrap{width:min(560px,94vw);padding:24px 0 40px}
    .top-bar{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:14px}
    .mini-title{margin:0 0 5px;color:#55a4de;font-size:11px;font-weight:800;letter-spacing:.14em}
    h1{margin:0;font-size:clamp(25px,6vw,36px);letter-spacing:-.04em}
    .score-area{display:flex;gap:8px}
    .score-area div{min-width:80px;padding:9px 12px;background:#fff;border-radius:15px;text-align:center;font-size:11px;box-shadow:0 7px 18px rgba(45,110,150,.08)}
    .score-area strong{display:block;margin-top:3px;font-size:20px}
    .game-box{position:relative;width:100%;overflow:hidden;border:6px solid #fff;border-radius:28px;box-shadow:0 20px 45px rgba(50,105,150,.18)}
    canvas{display:block;width:100%;height:auto;background:linear-gradient(#79ccff,#d9f4ff);touch-action:none}
    .start-screen,.game-over{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(217,244,255,.88);backdrop-filter:blur(8px)}
    .game-over{display:none}
    .start-card{width:min(340px,90%);padding:30px 24px;background:#fff;border-radius:28px;text-align:center;box-shadow:0 16px 35px rgba(40,95,135,.14)}
    .big-plane{font-size:60px;margin-bottom:8px}
    .start-card h2{margin:0 0 12px;font-size:25px}
    .start-card p{margin:0 0 20px;line-height:1.6;color:#6f7890}
    .start-card button{width:100%;padding:15px;border:0;border-radius:16px;background:#ffca4b;color:#4c3a12;font-size:17px;font-weight:900;cursor:pointer;box-shadow:0 8px 0 #dfa82b}
    .start-card button:active{transform:translateY(4px);box-shadow:0 4px 0 #dfa82b}
    .start-card small{display:block;margin-top:18px;color:#9ca4b5;font-size:11px}
    .help{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin-top:14px}
    .help span{padding:8px 12px;background:#fff;border-radius:999px;color:#6d7891;font-size:12px;box-shadow:0 5px 15px rgba(50,100,140,.07)}
    @media(max-width:500px){.top-bar{align-items:flex-start;flex-direction:column}.score-area{width:100%}.score-area div{flex:1}}
  </style>
</head>
<body>
  <div class="game-wrap">
    <header class="top-bar">
      <div>
        <p class="mini-title">KIDS AIR GAME</p>
        <h1>하늘 비행기 놀이 ✈️</h1>
      </div>
      <div class="score-area">
        <div>⭐ 점수<strong id="score">0</strong></div>
        <div>❤️ 하트<strong id="lives">3</strong></div>
      </div>
    </header>

    <div class="game-box">
      <canvas id="gameCanvas" width="480" height="720"></canvas>

      <div class="start-screen" id="startScreen">
        <div class="start-card">
          <div class="big-plane">✈️</div>
          <h2>풍선을 찾아 떠나볼까요?</h2>
          <p>비행기를 움직여<br>알록달록 풍선을 터뜨려보세요!</p>
          <button id="startBtn">출발하기</button>
          <small>← → 키 또는 마우스로 움직여요</small>
        </div>
      </div>

      <div class="game-over" id="gameOver">
        <div class="start-card">
          <div class="big-plane">🌟</div>
          <h2>정말 잘했어요!</h2>
          <p>모은 별 <strong id="finalScore">0</strong> 점</p>
          <button id="restartBtn">다시 놀기</button>
        </div>
      </div>
    </div>

    <div class="help">
      <span>⬅️ ➡️ 방향키</span>
      <span>🖱️ 마우스 이동</span>
      <span>✨ 자동 발사</span>
    </div>
  </div>

  <script>
    const canvas=document.getElementById('gameCanvas');
    const ctx=canvas.getContext('2d');
    const scoreText=document.getElementById('score');
    const livesText=document.getElementById('lives');
    const startScreen=document.getElementById('startScreen');
    const gameOver=document.getElementById('gameOver');
    const startBtn=document.getElementById('startBtn');
    const restartBtn=document.getElementById('restartBtn');
    const finalScore=document.getElementById('finalScore');
    const W=canvas.width,H=canvas.height;

    let running=false,score=0,lives=3,frame=0;
    const keys={left:false,right:false};
    const player={x:W/2,y:H-90,width:55,height:62,speed:5};
    let bullets=[],balloons=[],clouds=[],stars=[];

    function drawPlayer(){
      ctx.save();ctx.translate(player.x,player.y);
      ctx.fillStyle='#ffd64d';ctx.beginPath();ctx.ellipse(0,0,14,30,0,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#ff9f43';
      ctx.beginPath();ctx.moveTo(-10,0);ctx.lineTo(-38,20);ctx.lineTo(-10,14);ctx.closePath();ctx.fill();
      ctx.beginPath();ctx.moveTo(10,0);ctx.lineTo(38,20);ctx.lineTo(10,14);ctx.closePath();ctx.fill();
      ctx.fillStyle='#fff3a6';ctx.beginPath();ctx.arc(0,-23,9,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#e88332';ctx.beginPath();ctx.moveTo(-8,24);ctx.lineTo(0,36);ctx.lineTo(8,24);ctx.closePath();ctx.fill();
      ctx.fillStyle='#3b4252';ctx.beginPath();ctx.arc(-4,-21,1.8,0,Math.PI*2);ctx.arc(4,-21,1.8,0,Math.PI*2);ctx.fill();
      ctx.restore();
    }

    function shoot(){bullets.push({x:player.x,y:player.y-35,speed:7,radius:6})}
    function updateBullets(){bullets.forEach(b=>b.y-=b.speed);bullets=bullets.filter(b=>b.y>-20)}
    function drawBullets(){
      bullets.forEach(b=>{const g=ctx.createRadialGradient(b.x,b.y,1,b.x,b.y,8);g.addColorStop(0,'#fff');g.addColorStop(.4,'#fff176');g.addColorStop(1,'#ffbb33');ctx.fillStyle=g;ctx.beginPath();ctx.arc(b.x,b.y,b.radius,0,Math.PI*2);ctx.fill()})
    }

    const balloonColors=['#ff6b8a','#ffb84d','#5ac8fa','#7bd87b','#b58cff','#ff8ec7'];
    function createBalloon(){const radius=20+Math.random()*8;balloons.push({x:40+Math.random()*(W-80),y:-40,radius,speed:1+Math.random()*.8,color:balloonColors[Math.floor(Math.random()*balloonColors.length)]})}
    function updateBalloons(){balloons.forEach(b=>b.y+=b.speed);balloons=balloons.filter(b=>b.y<H+60)}
    function drawBalloon(b){
      ctx.save();ctx.strokeStyle='rgba(80,80,80,.5)';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(b.x,b.y+b.radius);ctx.lineTo(b.x,b.y+b.radius+28);ctx.stroke();
      ctx.fillStyle=b.color;ctx.beginPath();ctx.ellipse(b.x,b.y,b.radius,b.radius*1.15,0,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='rgba(255,255,255,.5)';ctx.beginPath();ctx.ellipse(b.x-7,b.y-8,4,7,-.4,0,Math.PI*2);ctx.fill();ctx.restore();
    }

    function createCloud(){clouds.push({x:50+Math.random()*(W-100),y:-80,size:30+Math.random()*20,speed:.5+Math.random()*.5})}
    function updateClouds(){clouds.forEach(c=>c.y+=c.speed);clouds=clouds.filter(c=>c.y<H+100)}
    function drawCloud(c){const x=c.x,y=c.y,s=c.size;ctx.fillStyle='rgba(255,255,255,.85)';ctx.beginPath();ctx.arc(x,y,s*.5,0,Math.PI*2);ctx.arc(x+s*.5,y,s*.65,0,Math.PI*2);ctx.arc(x+s,y,s*.45,0,Math.PI*2);ctx.fill()}

    function createStarBurst(x,y){for(let i=0;i<8;i++)stars.push({x,y,vx:(Math.random()-.5)*4,vy:(Math.random()-.5)*4,life:30})}
    function updateStars(){stars.forEach(s=>{s.x+=s.vx;s.y+=s.vy;s.life--});stars=stars.filter(s=>s.life>0)}
    function drawStars(){ctx.fillStyle='#ffe75c';stars.forEach(s=>{ctx.globalAlpha=s.life/30;ctx.beginPath();ctx.arc(s.x,s.y,4,0,Math.PI*2);ctx.fill()});ctx.globalAlpha=1}

    function collisionCheck(){
      for(let i=bullets.length-1;i>=0;i--){const bullet=bullets[i];
        for(let j=balloons.length-1;j>=0;j--){const balloon=balloons[j];const dx=bullet.x-balloon.x,dy=bullet.y-balloon.y;const d=Math.sqrt(dx*dx+dy*dy);
          if(d<balloon.radius+bullet.radius){createStarBurst(balloon.x,balloon.y);balloons.splice(j,1);bullets.splice(i,1);score+=10;scoreText.textContent=score;break}
        }
      }
    }

    function updatePlayer(){if(keys.left)player.x-=player.speed;if(keys.right)player.x+=player.speed;player.x=Math.max(35,Math.min(W-35,player.x))}
    function drawBackground(){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#72caff');g.addColorStop(1,'#dff6ff');ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}

    function gameLoop(){
      if(!running)return;
      frame++;drawBackground();updatePlayer();
      if(frame%22===0)shoot();
      if(frame%75===0)createBalloon();
      if(frame%170===0)createCloud();
      updateBullets();updateBalloons();updateClouds();updateStars();collisionCheck();
      clouds.forEach(drawCloud);balloons.forEach(drawBalloon);drawBullets();drawStars();drawPlayer();requestAnimationFrame(gameLoop)
    }

    function startGame(){score=0;lives=3;frame=0;bullets=[];balloons=[];clouds=[];stars=[];player.x=W/2;scoreText.textContent=score;livesText.textContent=lives;startScreen.style.display='none';gameOver.style.display='none';running=true;gameLoop()}

    window.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')keys.left=true;if(e.key==='ArrowRight')keys.right=true});
    window.addEventListener('keyup',e=>{if(e.key==='ArrowLeft')keys.left=false;if(e.key==='ArrowRight')keys.right=false});

    function moveWithPointer(clientX){const rect=canvas.getBoundingClientRect();const scale=canvas.width/rect.width;player.x=(clientX-rect.left)*scale;player.x=Math.max(35,Math.min(W-35,player.x))}
    canvas.addEventListener('mousemove',e=>{if(running)moveWithPointer(e.clientX)});
    canvas.addEventListener('touchmove',e=>{e.preventDefault();if(running)moveWithPointer(e.touches[0].clientX)},{passive:false});

    startBtn.addEventListener('click',startGame);
    restartBtn.addEventListener('click',startGame);

    drawBackground();drawPlayer();
  </script>
</body>
</html>
